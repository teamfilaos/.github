name: "🚀 Demande d'évolution"
description: "Proposer, spécifier et préparer une évolution fonctionnelle ou technique"
title: "[FEATURE] "
labels:
  - "enhancement"

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Demande d'évolution

        Décrivez d'abord le besoin et le résultat attendu.
        Les éléments techniques peuvent être complétés lors de la qualification.

  # 1. CONTEXTE ET OBJECTIFS
  - type: textarea
    id: contexte
    attributes:
      label: "🎯 Contexte et problématique"
      description: "Quel problème doit être résolu, pour qui et pourquoi ?"
      placeholder: |
        **Situation actuelle :**
        Décrire le fonctionnement existant.

        **Problème identifié :**
        Expliquer les limites ou difficultés rencontrées.

        **Impact :**
        Préciser les utilisateurs, services ou processus concernés.
    validations:
      required: true

  - type: textarea
    id: objectifs
    attributes:
      label: "🏆 Objectifs et valeur ajoutée"
      description: "Quels résultats mesurables souhaite-t-on obtenir ?"
      placeholder: |
        - Objectif principal :
        - Bénéfices attendus :
        - Indicateurs de réussite :
    validations:
      required: true

  - type: dropdown
    id: type-evolution
    attributes:
      label: "📂 Type d'évolution"
      options:
        - "Fonctionnelle"
        - "Technique"
        - "Performance"
        - "Sécurité"
        - "Architecture"
        - "Expérience utilisateur (UX/UI)"
        - "Infrastructure / DevOps"
        - "Autre"
    validations:
      required: true

  - type: dropdown
    id: priorite
    attributes:
      label: "⚡ Priorité proposée"
      description: "La priorité définitive sera confirmée lors de la qualification."
      options:
        - "À qualifier"
        - "P0 - Critique"
        - "P1 - Haute"
        - "P2 - Normale"
        - "P3 - Basse"
      default: 0
    validations:
      required: true

  # 2. SPÉCIFICATIONS
  - type: textarea
    id: description
    attributes:
      label: "📋 Description de l'évolution"
      description: "Décrire le comportement attendu et les règles métier."
      placeholder: |
        **En tant que** [type d'utilisateur],
        **je souhaite** [fonctionnalité],
        **afin de** [bénéfice attendu].

        ### Fonctionnement attendu
        1. L'utilisateur...
        2. Le système...
        3. Le résultat...

        ### Règles métier
        - Règle 1 :
        - Règle 2 :

        ### Cas particuliers
        - Cas limite :
        - Gestion des erreurs :
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 Solution technique envisagée"
      description: "Facultatif à la création ; à compléter lors de l'analyse technique."
      placeholder: |
        ### Approche proposée
        Décrire la solution et les alternatives envisagées.

        ### Composants concernés (si applicable)
        - Frontend :
        - Backend :
        - API :
        - Base de données :
        - Infrastructure :

        ### Modifications et contraintes
        - Interfaces / contrats API :
        - Migrations :
        - Compatibilité :
    validations:
      required: false

  # 3. PLAN D'IMPLÉMENTATION
  - type: textarea
    id: implementation
    attributes:
      label: "🛠️ Plan d'implémentation"
      description: "Facultatif à la soumission. Adapter les tâches aux composants réellement concernés."
      placeholder: |
        ### Analyse et conception
        - [ ] Identifier les impacts et dépendances
        - [ ] Valider les règles métier et les cas limites

        ### Développement
        - [ ] Implémenter les changements nécessaires
        - [ ] Gérer les erreurs et la compatibilité

        ### Tests et qualité
        - [ ] Ajouter les tests pertinents
        - [ ] Vérifier les régressions, la sécurité et les performances

        ### Livraison
        - [ ] Mettre à jour la documentation
        - [ ] Préparer le déploiement et le retour arrière si nécessaire
        - [ ] Effectuer la recette et les vérifications post-déploiement
    validations:
      required: false

  # 4. VALIDATION ET QUALITÉ
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Critères d'acceptation"
      description: "Définir au moins un résultat observable et vérifiable, spécifique à cette évolution."
      placeholder: |
        - [ ] Critère métier spécifique n°1 :
        - [ ] Critère métier spécifique n°2 :

        ### Scénario nominal
        **Étant donné** ...
        **Lorsque** ...
        **Alors** ...

        ### Scénario d'erreur ou cas limite
        **Étant donné** ...
        **Lorsque** ...
        **Alors** ...
    validations:
      required: true

  - type: textarea
    id: risques
    attributes:
      label: "⚠️ Risques, impacts et dépendances"
      description: "Facultatif à la création ; à enrichir pendant la qualification."
      placeholder: |
        ### Risques
        - Risque / impact :
        - Mesure d'atténuation :

        ### Compatibilité
        - Rétrocompatibilité :
        - Données et API :

        ### Dépendances
        - Issues ou PR liées :
        - Services externes :
        - Équipes concernées :
    validations:
      required: false

  # 5. ESTIMATION ET LIVRAISON
  - type: dropdown
    id: complexite
    attributes:
      label: "📊 Complexité estimée"
      description: "Estimation indicative, à confirmer par l'équipe technique."
      options:
        - "À estimer"
        - "XS - Très faible"
        - "S - Faible"
        - "M - Moyenne"
        - "L - Élevée"
        - "XL - Très élevée"
      default: 0
    validations:
      required: true

  - type: textarea
    id: deploiement
    attributes:
      label: "🚢 Stratégie de déploiement"
      description: "À compléter si le changement nécessite des précautions de livraison."
      placeholder: |
        **Déploiement :**
        - Prérequis :
        - Ordre des opérations :
        - Feature flag :

        **Vérifications post-déploiement :**
        - Logs et métriques :
        - Tests de validation :

        **Retour arrière :**
        - Conditions de déclenchement :
        - Procédure de rollback :
    validations:
      required: false

  - type: textarea
    id: documentation
    attributes:
      label: "📚 Documentation et références"
      description: "Ajouter les liens et ressources utiles."
      placeholder: |
        - Documentation technique :
        - Maquettes / Figma :
        - Spécifications API :
        - Issues liées :
        - ADR / décisions d'architecture :
    validations:
      required: false

  # 6. DEFINITION OF READY — AVANT SOUMISSION
  - type: checkboxes
    id: readiness
    attributes:
      label: "📌 Vérification avant soumission"
      description: "Confirmer que la demande est suffisamment claire pour être qualifiée."
      options:
        - label: "Le problème et les objectifs sont clairement décrits"
          required: true
        - label: "Le comportement attendu et les critères d'acceptation sont vérifiables"
          required: true
        - label: "J'ai vérifié qu'aucune issue similaire n'existe"
          required: true
