name: 🚀 Feature Request
description: Suggérer une nouvelle idée pour ce projet
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une amélioration !
  - type: textarea
    id: problem
    attributes:
      label: Quel problème voulez-vous résoudre ?
      description: Une description claire de ce qu'est le problème.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Description de la solution souhaitée
      description: Dites-nous ce que vous aimeriez qu'il se passe.
    validations:
      required: true